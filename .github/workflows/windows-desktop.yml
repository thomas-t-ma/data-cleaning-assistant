name: windows-desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/data_cleaning_assistant/desktop_app.py"
      - "src/data_cleaning_assistant/web_app.py"
      - "src/data_cleaning_assistant/web_service.py"
      - "packaging/windows/**"
      - "scripts/build_windows.ps1"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Python build dependencies
        run: python -m pip install -e ".[desktop,desktop-build]"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build and self-test desktop package
        shell: pwsh
        run: ./scripts/build_windows.ps1 -BuildInstaller

      - name: Upload Windows desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DataCleaningAssistant-Windows-x64
          if-no-files-found: error
          retention-days: 3
          path: |
            dist/DataCleaningAssistant-*-Windows-x64-portable.zip
            dist/installer/DataCleaningAssistant-*-Windows-x64-Setup.exe
            dist/SHA256SUMS.txt
