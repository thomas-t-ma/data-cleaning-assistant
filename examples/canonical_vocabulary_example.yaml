    columns:
      license:
        canonical_values:
          "GNU General Public License":
            aliases:
              - "GNU GENERAL PUBLIC LICENSE"
              - "GNU General public license"
              - "GNU General Public License (GPL)"
          "GNU General Public License v2.0":
            aliases: []
          "GNU General Public License v3":
            aliases: []
      count_status:
        canonical_values:
          Unclear:
            aliases:
              - unclear
              - Uclear
        missing_tokens: ["NA"]
