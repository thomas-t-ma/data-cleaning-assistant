[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "data-cleaning-assistant-local"
version = "0.15.0"
description = "Local-first data profiling and cleaning assistant engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Thomas Ma" }]
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
]

[project.scripts]
data-cleaner = "data_cleaning_assistant.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/data_cleaning_assistant"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["I001"]
